name: Daily On-Chain Activity

permissions: {}

on:
  schedule:
    # Runs at 02:00 UTC (09:00 AM VN) every day
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  simulate-activity:
    name: Simulate Multi-Wallet Activity on Atlantic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Multi-Wallet Simulation Broadcast
        env:
          RPC_URL: "https://atlantic.dplabs-internal.com"
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          INVOICE_MANAGER_V2_ADDRESS: "0xB4f7A4dA6eD75033E25231bd43D9A207797391f6"
          TBT_ADDRESS: "0x326b07d3e36c1Aa6213368E5e1AaDa29f2CB4BE5"
          USDC_ADDRESS: "0x91a487BfAC67b3CF39F51425f762510dCb196026"
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "::error::DEPLOYER_PRIVATE_KEY secret is not configured in repository settings."
            exit 1
          fi
          forge script script/SimulateMultiWalletLifecycle.s.sol:SimulateMultiWalletLifecycle \
            --rpc-url "$RPC_URL" \
            --private-key "$DEPLOYER_PRIVATE_KEY" \
            --broadcast \
            --slow \
            -vvv
